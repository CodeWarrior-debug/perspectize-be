version: "2"

run:
  timeout: 3m

linters:
  default: standard
  enable:
    - gocritic
    - revive
    - misspell
    - prealloc
    - unconvert
    - nilerr

  settings:
    gocritic:
      enabled-checks:
        - nilValReturn
        - truncateCmp
        - unnecessaryBlock

    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: exported
        - name: increment-decrement
        - name: receiver-naming
        - name: unexported-return
        - name: var-naming

    misspell:
      locale: US

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - revive
        text: "dot-imports"
      - path: _test\.go
        linters:
          - gocritic
    paths:
      - vendor
      - bin
      - tmp
